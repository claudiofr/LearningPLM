[tool.poetry]
name = "plm-framework"
version = "0.1.0"
description = "Flexible Learning PLM Framework for protein sequence optimization"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
torch = "^2.0.0, <2.3.0"
transformers = "^4.30.0"
pydantic = "^2.0.0"
typer = "^0.9.0"
scikit-learn = "^1.3.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
bitsandbytes = "^0.41.0"
omegaconf = "^2.3.0"
h5py = "^3.9.0"
tqdm = "^4.66.0"
biopython = "^1.83.0"
matplotlib = "^3.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
ruff = "^0.0.270"
isort = "^5.12.0"
mdformat = "^0.7.16"
pre-commit = "^3.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
plm = "plm_framework.cli:app"
