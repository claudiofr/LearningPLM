model:
  name: facebook/esm2_t33_650M_UR50D
  embedding_dim: 1280
  reduced_dim: null
  use_pooling: true
  quantize: false
training:
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 1.0e-05
  epochs: 100
  early_stopping: 10
  device: auto
active_learning:
  acquisition: ucb
  batch_size: 32
  temperature: 1.0
  exploration_weight: 2.0
  diversity_weight: 0.5
rl:
  policy: a2c
  gamma: 0.99
  entropy_coef: 0.01
  max_mutations: 5
  mutation_penalty: 0.1
data:
  db_path: data/variants.db
  embedding_cache: data/embeddings.h5
  output_dir: results
